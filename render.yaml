# Render blueprint for the d-scims API, on the free plan. The database is Neon and the web app is on Vercel.
# Apply with: Render dashboard > New > Blueprint, pointing at this repository. See docs/DEPLOY.md.
#
# Free plan notes: the web service sleeps after 15 minutes without traffic (the first request afterwards takes about a
# minute). Phase 1 uses no Redis, so none is created here. Render allows one free Key Value instance per account;
# add REDIS_URL when a later phase needs queues (BullMQ), and move to a paid plan before real dealers depend on this.
services:
  - type: web
    name: dscims-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # No dockerCommand: the Dockerfile's CMD runs the migrations and then the server (free plans have no pre-deploy step).
    autoDeploy: false # promote by hand after the phase checklist is signed off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: TENANT_GRACE_DAYS
        value: "7"
      - key: SESSION_DAYS
        value: "14"
      - key: EMAIL_TYPE # smtp or resend; each needs its own credentials below
        sync: false
      - key: GEOCODER_USER_AGENT
        value: d-scims/0.1 (rolatzarza@gmail.com)
      # Set these in the dashboard (never commit them):
      - key: DATABASE_URL # Neon pooled connection string
        sync: false
      - key: MIGRATION_DATABASE_URL # Neon direct (non-pooled) connection string
        sync: false
      - key: PUBLIC_WEB_URL # the Vercel URL, used in invite and reset links
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: RESEND_API_KEY # only when EMAIL_TYPE=resend
        sync: false
      - key: RESEND_FROM # for example: d-scims <no-reply@yourdomain.com>
        sync: false
      - key: SMTP_HOST # SMTP_* only when EMAIL_TYPE=smtp
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM # for example: d-scims <no-reply@yourdomain.com>
        sync: false
